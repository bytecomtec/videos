<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Videos - Bytecomtec</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo móvil automático -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Institucional -->
    <header class="bg-slate-900 text-white py-6 px-4 shadow-md text-center">
        <h1 class="text-2xl font-bold tracking-wide">Bytecomtec Portal</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Repositorio de Videos Técnicos y Comerciales</p>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
        
        <!-- Barra de Búsqueda -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Buscar video por título o tecnología..." 
                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm text-sm bg-white">
        </div>

        <!-- Filtros por Categoría (Deslizables en Móvil) -->
        <div class="flex overflow-x-auto space-x-2 pb-4 mb-6 no-scrollbar">
            <button onclick="filterCategory('all')" class="category-btn px-4 py-2 bg-blue-600 text-white rounded-full text-xs font-semibold whitespace-nowrap shadow-sm transition">Todos (150)</button>
            <button onclick="filterCategory('cctv')" class="category-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm hover:bg-slate-100 transition">CCTV y Seguridad</button>
            <button onclick="filterCategory('redes')" class="category-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm hover:bg-slate-100 transition">Redes y Enlaces</button>
            <button onclick="filterCategory('telefonia')" class="category-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm hover:bg-slate-100 transition">Telefonía IP</button>
            <button onclick="filterCategory('energia')" class="category-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm hover:bg-slate-100 transition">Energía y UPS</button>
            <button onclick="filterCategory('comercial')" class="category-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 rounded-full text-xs font-semibold whitespace-nowrap shadow-sm hover:bg-slate-100 transition">Comercial</button>
        </div>

        <!-- Cuadrícula de Videos (Grid adaptable a celulares) -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            
            <!-- Tarjeta de Video Ejemplo 1 -->
            <div class="video-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between" data-category="cctv" data-title="configuracion de nvr dvr hikvision">
                <div>
                    <span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-bold rounded mb-2 uppercase">CCTV</span>
                    <h3 class="text-sm font-semibold text-slate-800 mb-2">Configuración de NVR/DVR Hikvision</h3>
                </div>
                <a href="#" target="_blank" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 rounded-lg text-center transition shadow-sm">Ver Video</a>
            </div>

            <!-- Tarjeta de Video Ejemplo 2 -->
            <div class="video-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between" data-category="cctv" data-title="hikvision colorvu">
                <div>
                    <span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-bold rounded mb-2 uppercase">CCTV</span>
                    <h3 class="text-sm font-semibold text-slate-800 mb-2">Hikvision ColorVu: Todo sobre la noche a color</h3>
                </div>
                <a href="#" target="_blank" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 rounded-lg text-center transition shadow-sm">Ver Video</a>
            </div>

            <!-- Tarjeta de Video Ejemplo 3 -->
            <div class="video-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between" data-category="redes" data-title="enlaces inalambricos ubiquiti mikrotik">
                <div>
                    <span class="inline-block px-2 py-0.5 bg-emerald-50 text-emerald-700 text-[10px] font-bold rounded mb-2 uppercase">Redes</span>
                    <h3 class="text-sm font-semibold text-slate-800 mb-2">Optimización y Alineación de Enlaces Inalámbricos</h3>
                </div>
                <a href="#" target="_blank" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 rounded-lg text-center transition shadow-sm">Ver Video</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-auto">
        Bytecomtec &copy; 2026 - Todos los derechos reservados
    </footer>

    <!-- Script de Filtrado y Búsqueda Instantánea -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const videoCards = document.querySelectorAll('.video-card');
        const categoryButtons = document.querySelectorAll('.category-btn');

        let currentCategory = 'all';

        // Búsqueda por texto
        searchInput.addEventListener('input', (e) => {
            filterVideos();
        });

        // Filtrado por categoría
        function filterCategory(category) {
            currentCategory = category;
            
            // Estilos de botones activos
            categoryButtons.forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            });
            event.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
            event.target.classList.add('bg-blue-600', 'text-white');

            filterVideos();
        }

        function filterVideos() {
            const query = searchInput.value.toLowerCase().trim();

            videoCards.forEach(card => {
                const category = card.getAttribute('data-category');
                const title = card.getAttribute('data-title');
                
                const matchesCategory = (currentCategory === 'all' || category === currentCategory);
                const matchesSearch = title.includes(query);

                if (matchesCategory && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
